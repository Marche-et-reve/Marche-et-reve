    <li> Randonnée - restau le 9 mai 2027 </li>
  </ul>
    </center>
<footer class="footer">
    En cours de chargement...
</footer>

<script>
async function afficherDernierCommit() {

    const proprietaire = "Marche-et-reve";
    const depot = "Marche-et-reve";
    const branche = "main";

    const element = document.querySelector(".footer");

    if (!element) {
        console.error("Élément .footer introuvable");
        return;
    }

    const url = `https://api.github.com/repos/${proprietaire}/${depot}/commits?sha=${branche}&per_page=1`;

    try {

        const reponse = await fetch(url);

        if (!reponse.ok) {
            throw new Error("Erreur HTTP : " + reponse.status);
        }

        const commits = await reponse.json();

        if (!commits.length) {
            throw new Error("Aucun commit trouvé");
        }

        const date = new Date(commits[0].commit.committer.date);

        const dateFormatee = date.toLocaleString("fr-FR", {
            day: "2-digit",
            month: "long",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        });

        element.textContent =
            "Site crée le 09/11/2026 - Dernière mise à jour : " + dateFormatee;

    } catch (erreur) {

        console.error("Erreur GitHub :", erreur);

        element.textContent =
            "Date de mise à jour indisponible";
    }
}

afficherDernierCommit();
</script>
</body>
